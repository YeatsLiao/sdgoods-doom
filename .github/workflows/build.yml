name: Build firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: idf.py build (esp32s3)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5
    steps:
      # 本工程（SDGOODS_DOOM）
      - name: Checkout sdgoods-doom
        uses: actions/checkout@v4
        with:
          path: main-repo

      # 引擎源码树：GBADoom 的 esp32-sdgoods 分支（PrBoom 血统，纯 C）
      - name: Checkout GBADoom (esp32-sdgoods)
        uses: actions/checkout@v4
        with:
          repository: YeatsLiao/GBADoom
          ref: esp32-sdgoods
          path: gbadoom

      # 依赖由 ESP-IDF 组件管理器按 dependencies.lock 拉取（lvgl 等），无需预置
      - name: Build
        working-directory: main-repo
        run: |
          . $IDF_PATH/export.sh
          idf.py -B build build \
            -DGBADOOM_PATH="${GITHUB_WORKSPACE}/gbadoom"

      - name: Check app fits partition
        working-directory: main-repo
        run: |
          # 单应用槽 0x300000 = 3MB；超限直接失败，避免产出无法烧录的固件
          SIZE=$(stat -c%s build/SDGOODS_DOOM.bin)
          echo "SDGOODS_DOOM.bin = $SIZE bytes"
          if [ "$SIZE" -gt 3145728 ]; then
            echo "✗ bin 超过 3MB 应用槽（$SIZE bytes）" >&2
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: |
            main-repo/build/bootloader/bootloader.bin
            main-repo/build/partition_table/partition-table.bin
            main-repo/build/SDGOODS_DOOM.bin
          if-no-files-found: error
