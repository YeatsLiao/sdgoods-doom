name: Release firmware

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and attach firmware + WAD to GitHub Release
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5
    steps:
      - name: Checkout sdgoods-doom
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout GBADoom (esp32-sdgoods)
        uses: actions/checkout@v4
        with:
          repository: YeatsLiao/GBADoom
          ref: esp32-sdgoods
          path: gbadoom

      - name: Build
        working-directory: main-repo
        run: |
          . $IDF_PATH/export.sh
          idf.py -B build build -DGBADOOM_PATH="${GITHUB_WORKSPACE}/gbadoom"

      - name: Collect artifacts
        working-directory: main-repo
        run: |
          mkdir -p dist
          cp build/SDGOODS_DOOM.bin dist/
          cp build/bootloader/bootloader.bin dist/
          cp build/partition_table/partition-table.bin dist/
          cp DOOM1_PROCESSED.WAD dist/ 2>/dev/null || echo "WAD not in repo (shareware, attach manually)"
          cd dist
          sha256sum ./* > SHA256SUMS.txt

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main-repo/dist/*
          body: |
            ## 谷仓次元屏 DOOM 固件

            安装三步（ESP32-S3，32MB Flash）：
            ```
            esptool.py --chip esp32s3 -p <PORT> -b 921600 --before default_reset --after no_reset \
              write_flash 0x0 bootloader.bin 0x8000 partition-table.bin 0x10000 SDGOODS_DOOM.bin
            esptool.py --chip esp32s3 -p <PORT> erase_region 0x310000 0x2000          # 擦 otadata → 单应用直启
            esptool.py --chip esp32s3 -p <PORT> -b 921600 write_flash 0x1000000 DOOM1_PROCESSED.WAD   # WAD → appdata
            ```
            或直接 `python tools/flash_local.sh -p <PORT> -B 921600`。
